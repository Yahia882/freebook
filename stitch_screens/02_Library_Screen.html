<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Library</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for Editorial / Minimalist Typography -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style data-purpose="custom-typography">
    .font-book-serif {
      font-family: 'Cinzel', serif;
    }
    .font-sans-ui {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
<style data-purpose="glass-dock-effects">
    /* Floating Capsule Blur & Border Styles */
    .glass-capsule {
      background: rgba(36, 36, 38, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65), 0 0 1px 1px rgba(255, 255, 255, 0.05) inset;
    }
    
    .tab-selected-bg {
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body class="bg-[#0e0e10] text-[#f2f2f3] font-sans-ui antialiased flex justify-center items-center min-h-screen p-0 sm:p-4 select-none">
<!-- BEGIN: MobileDeviceFrame -->
<div class="relative w-full max-w-[390px] h-[844px] bg-[#121214] overflow-hidden flex flex-col justify-between shadow-2xl sm:rounded-[48px] border-0 sm:border-[8px] sm:border-[#222224]" data-purpose="mobile-viewport">
<!-- BEGIN: StatusBar -->
<header class="w-full pt-3 px-7 flex justify-between items-center text-xs tracking-tight text-white/90 z-30 select-none" data-purpose="ios-status-bar">
<!-- Time -->
<span class="font-semibold text-sm tracking-normal">9:41</span>
<!-- System Icons: Cellular, WiFi, Battery -->
<div class="flex items-center space-x-2 text-white fill-current">
<!-- Signal / Cellular Icon -->
<svg class="w-4 h-3.5" fill="currentColor" viewBox="0 0 17 12">
<rect height="3" rx="0.5" width="2.5" x="0" y="9"></rect>
<rect height="5.5" rx="0.5" width="2.5" x="4" y="6.5"></rect>
<rect height="8" rx="0.5" width="2.5" x="8" y="4"></rect>
<rect height="11" rx="0.5" width="2.5" x="12" y="1"></rect>
</svg>
<!-- WiFi Icon -->
<svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 18c-.8 0-1.5.7-1.5 1.5S11.2 21 12 21s1.5-.7 1.5-1.5S12.8 18 12 18zm-4.9-3.5a6.9 6.9 0 0 1 9.8 0 .8.8 0 1 0 1.1-1.1 8.5 8.5 0 0 0-12 0 .8.8 0 1 0 1.1 1.1zm-3.6-3.6a12 12 0 0 1 17 0 .8.8 0 1 0 1.1-1.1 13.6 13.6 0 0 0-19.2 0 .8.8 0 0 0 1.1 1.1z"></path>
</svg>
<!-- Battery Percentage and Icon -->
<div class="flex items-center gap-1">
<span class="text-[10px] font-medium text-white/90">100%</span>
<div class="w-5 h-2.5 rounded-[3px] border border-white/80 p-0.5 flex items-center">
<div class="w-full h-full bg-white rounded-[1.5px]"></div>
</div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: MainContentArea -->
<main class="flex-1 flex flex-col px-5 pt-3 overflow-y-auto no-scrollbar pb-24">
<!-- BEGIN: TopBarTitleAndActions -->
<section class="flex justify-between items-center pt-2 pb-5" data-purpose="page-header">
<h1 class="text-2xl font-bold tracking-tight text-white">Library</h1>
<!-- Action Buttons -->
<div class="flex items-center space-x-4 text-white/85">
<!-- Search Icon -->
<button aria-label="Search" class="p-1.5 hover:text-white transition-colors focus:outline-none">
<svg class="w-[21px] h-[21px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<circle cx="11" cy="11" r="7"></circle>
<line stroke-linecap="round" x1="21" x2="16.5" y1="21" y2="16.5"></line>
</svg>
</button>
<!-- Add Book Icon -->
<button aria-label="Add book" class="p-1.5 hover:text-white transition-colors focus:outline-none">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M12 5v14m-7-7h14"></path>
</svg>
</button>
<!-- More Options Icon -->
<button aria-label="More options" class="p-1.5 hover:text-white transition-colors focus:outline-none">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
<circle cx="12" cy="5" r="1.5"></circle>
<circle cx="12" cy="12" r="1.5"></circle>
<circle cx="12" cy="19" r="1.5"></circle>
</svg>
</button>
</div>
</section>
<!-- END: TopBarTitleAndActions -->
<!-- BEGIN: FilterPills -->
<section class="flex items-center space-x-2 pb-6" data-purpose="filter-pills">
<!-- Selected Pill: All -->
<button class="px-4 py-1.5 rounded-full bg-[#1e1e21] border border-[#303036] text-xs font-semibold text-white tracking-wide shadow-sm">
          All
        </button>
<!-- Filter Pill: Continue -->
<button class="px-4 py-1.5 rounded-full bg-transparent border border-[#2a2a30] text-xs font-normal text-white/60 hover:text-white hover:border-[#3c3c44] transition-colors">
          Continue
        </button>
<!-- Filter Pill: Finished -->
<button class="px-4 py-1.5 rounded-full bg-transparent border border-[#2a2a30] text-xs font-normal text-white/60 hover:text-white hover:border-[#3c3c44] transition-colors">
          Finished
        </button>
</section>
<!-- END: FilterPills -->
<!-- BEGIN: BooksGrid -->
<section class="grid grid-cols-3 gap-3.5" data-purpose="books-shelf">
<!-- Book Card 1: A Room of One's Own -->
<article class="flex flex-col cursor-pointer group">
<div class="relative w-full aspect-[1/1.45] bg-[#efeff1] rounded-[3px] shadow-md flex flex-col justify-between p-2.5 transition-transform duration-200 group-hover:scale-[1.02]">
<!-- Title & Author header on cover -->
<div>
<h2 class="font-book-serif text-[9px] font-bold text-black leading-[11px] tracking-wider text-left uppercase">
                A Room<br>Of One's<br>Own
              </h2>
</div>
<!-- Minimal Geometric Arch Illustration -->
<div class="w-full flex justify-center py-1">
<div class="w-9 h-11 bg-[#1a1a1c] rounded-t-full"></div>
</div>
<!-- Author signature -->
<p class="font-book-serif text-[5.5px] font-semibold text-black tracking-widest uppercase">
              Virginia Woolf
            </p>
</div>
<!-- Progress Meta -->
<span class="mt-2 text-[11px] text-white/50 font-medium">42%</span>
</article>
<!-- Book Card 2: Meditations -->
<article class="flex flex-col cursor-pointer group">
<div class="relative w-full aspect-[1/1.45] bg-[#dedee1] rounded-[3px] shadow-md flex flex-col justify-between p-2.5 transition-transform duration-200 group-hover:scale-[1.02]">
<!-- Title -->
<div>
<h2 class="font-book-serif text-[7.5px] font-semibold text-black tracking-wider text-center uppercase">
                Meditations
              </h2>
</div>
<!-- Minimal Geometric Circle & Pedestal Illustration -->
<div class="w-full flex flex-col items-center justify-center py-1">
<div class="w-8 h-8 rounded-full border-[1.2px] border-[#222224]"></div>
<div class="w-9 h-[1.5px] bg-[#222224] mt-1.5"></div>
<div class="w-7 h-[1.5px] bg-[#222224] mt-0.5"></div>
</div>
<!-- Author -->
<p class="font-book-serif text-[5.5px] font-semibold text-black tracking-widest text-center uppercase">
              Marcus Aurelius
            </p>
</div>
<!-- Status Meta -->
<span class="mt-2 text-[11px] text-white/50 font-medium">New</span>
</article>
<!-- Book Card 3: The Book of Tea -->
<article class="flex flex-col cursor-pointer group">
<div class="relative w-full aspect-[1/1.45] bg-[#343538] rounded-[3px] shadow-md flex flex-col justify-between p-2.5 transition-transform duration-200 group-hover:scale-[1.02]">
<!-- Title -->
<div>
<h2 class="font-book-serif text-[8.5px] font-medium text-[#ebebee] leading-[10.5px] tracking-wide text-left uppercase">
                The<br>Book<br>Of Tea
              </h2>
</div>
<!-- Minimal Geometric Oval Illustration -->
<div class="w-full flex justify-center py-2">
<div class="w-10 h-4 border border-[#cfcfd3] rounded-[100%]"></div>
</div>
<!-- Author -->
<p class="font-book-serif text-[5.5px] font-normal text-[#c6c6cb] tracking-wider uppercase">
              Okakura Kakuzo
            </p>
</div>
<!-- Status Meta -->
<span class="mt-2 text-[11px] text-white/50 font-medium">Finished</span>
</article>
</section>
<!-- END: BooksGrid -->
</main>
<!-- END: MainContentArea -->
<!-- BEGIN: FloatingBottomNavigation -->
<div class="absolute bottom-6 left-0 right-0 flex justify-center items-center pointer-events-none z-40" data-purpose="navigation-capsule-wrapper">
<nav aria-label="Bottom Navigation" class="pointer-events-auto glass-capsule p-1.5 rounded-full flex items-center gap-1 shadow-2xl" data-purpose="floating-dock">
<!-- Tab 1: Library (Active) -->
<button class="tab-selected-bg px-5 py-2 rounded-full flex flex-col items-center justify-center transition-all">
<!-- Book Open Icon -->
<span class="material-symbols-outlined text-[20px] text-white leading-none">menu_book</span>
<span class="text-[10px] font-medium text-white mt-0.5 tracking-tight">Library</span>
</button>
<!-- Tab 2: Notes (Inactive) -->
<button class="px-5 py-2 rounded-full flex flex-col items-center justify-center opacity-55 hover:opacity-90 transition-opacity">
<!-- Notepad / Edit Icon -->
<svg class="w-[18px] h-[18px] text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
<line x1="8.5" x2="8.5" y1="2.5" y2="5.5"></line>
<line x1="12" x2="12" y1="2.5" y2="4.5"></line>
</svg>
<span class="text-[10px] font-medium text-white mt-0.5 tracking-tight">Notes</span>
</button>
</nav>
</div>
<!-- END: FloatingBottomNavigation -->
<!-- BEGIN: HomeIndicator -->
<div class="w-full flex justify-center pb-2 z-50 pointer-events-none" data-purpose="ios-home-indicator">
<div class="w-32 h-1 bg-white/70 rounded-full"></div>
</div>
<!-- END: HomeIndicator -->
</div>
<!-- END: MobileDeviceFrame -->


</body></html>
