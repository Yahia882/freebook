<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Book Notes - The Book Of Tea</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBg: '#0f0f10',
            cardBorder: 'rgba(255, 255, 255, 0.08)',
            mutedText: '#7b7b80',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Segoe UI"', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Custom CSS for specific styling details -->
<style data-purpose="custom-glassmorphism">
    .capsule-dock {
      background: rgba(40, 40, 44, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .active-pill {
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }
  </style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"></head>
<body class="bg-black text-white flex justify-center items-center min-h-screen p-0 sm:p-4 select-none">
<!-- BEGIN: MobileContainer -->
<!-- Constrained mobile view frame -->
<div class="relative w-full max-w-[375px] h-[812px] bg-[#0f0f10] overflow-hidden flex flex-col sm:rounded-[44px] shadow-2xl border sm:border-[#222]">
<!-- BEGIN: StatusBar -->
<!-- Top iOS-style status bar with time, cellular, wifi, and battery indicator -->
<header class="w-full pt-3 px-6 pb-2 flex items-center justify-between text-xs tracking-tight text-white/90 z-20" data-purpose="status-bar">
<!-- Time -->
<span class="font-semibold text-sm">9:41</span>
<!-- System Icons -->
<div class="flex items-center space-x-2">
<!-- Cellular Signal Strength (4 bars) -->
<svg class="w-4 h-3.5 fill-current text-white/90" viewBox="0 0 18 14">
<rect height="3.5" rx="0.5" width="2.5" x="0" y="10.5"></rect>
<rect height="6.5" rx="0.5" width="2.5" x="4.5" y="7.5"></rect>
<rect height="10" rx="0.5" width="2.5" x="9" y="4"></rect>
<rect height="14" rx="0.5" width="2.5" x="13.5" y="0"></rect>
</svg>
<!-- WiFi Icon -->
<svg class="w-4 h-3.5 fill-current text-white/90" viewBox="0 0 16 12">
<path d="M8 2.75C5.17 2.75 2.63 3.86 0.74 5.67L0 4.9C2.11 2.87 4.93 1.62 8 1.62C11.07 1.62 13.89 2.87 16 4.9L15.26 5.67C13.37 3.86 10.83 2.75 8 2.75ZM8 6.25C6.18 6.25 4.54 7 3.3 8.19L2.55 7.42C4.01 6.01 5.91 5.12 8 5.12C10.09 5.12 11.99 6.01 13.45 7.42L12.7 8.19C11.46 7 9.82 6.25 8 6.25ZM8 9.75C6.9 9.75 6 10.65 6 11.75C6 11.89 6.11 12 6.25 12H9.75C9.89 12 10 11.89 10 11.75C10 10.65 9.1 9.75 8 9.75Z"></path>
</svg>
<!-- Percentage Label -->
<span class="text-[11px] font-medium text-white/80 pr-0.5">100%</span>
<!-- Battery Icon -->
<div class="flex items-center">
<div class="w-5 h-2.5 border border-white/80 rounded-[3px] p-[1px] flex items-center">
<div class="h-full w-full bg-white rounded-[1.5px]"></div>
</div>
<div class="w-[1.5px] h-1 bg-white/80 rounded-r-sm"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: NavigationBar -->
<!-- App Navigation with back arrow, title, and options menu -->
<nav class="w-full px-4 py-3 flex items-center justify-between border-b border-white/[0.04]" data-purpose="app-navigation">
<!-- Back Button -->
<button aria-label="Go back" class="p-1.5 -ml-1 text-white hover:text-white/80 transition-colors" type="button">
<svg class="w-5 h-5 stroke-current fill-none stroke-[2]" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<line x1="19" x2="5" y1="12" y2="12"></line>
<polyline points="12 19 5 12 12 5"></polyline>
</svg>
</button>
<!-- Screen Title -->
<h1 class="text-sm font-medium tracking-normal text-white">The Book Of Tea</h1>
<!-- More Options Button -->
<button aria-label="More options" class="p-1.5 -mr-1 text-white/80 hover:text-white transition-colors" type="button">
<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
<circle cx="12" cy="5" r="1.5"></circle>
<circle cx="12" cy="12" r="1.5"></circle>
<circle cx="12" cy="19" r="1.5"></circle>
</svg>
</button>
</nav>
<!-- END: NavigationBar -->
<!-- BEGIN: MainContentList -->
<!-- Scrollable container for notes and highlights -->
<main class="flex-1 overflow-y-auto px-4 divide-y divide-white/[0.07]" data-purpose="content-list">
<!-- Entry 1: Highlight Page 12 -->
<article class="pt-5 pb-5" data-purpose="highlight-entry">
<div class="flex items-center justify-between text-[11px] font-semibold tracking-wider text-mutedText mb-2.5">
<span class="">HIGHLIGHT</span>
<span class="">PAGE 12</span>
</div>
<p class="text-white text-[15px] font-normal leading-relaxed">
          always smile
        </p>
</article>
<!-- Entry 2: Note Page 18 -->
<article class="pt-5 pb-5" data-purpose="note-entry">
<div class="flex items-center justify-between text-[11px] font-semibold tracking-wider text-mutedText mb-2.5">
<span class="">NOTE</span>
<span class="">PAGE 18</span>
</div>
<p class="text-white text-[15px] font-normal leading-relaxed">
          Life is good if you feel good
        </p>
<span class="inline-block mt-2.5 text-xs text-mutedText font-normal">
          Added today
        </span>
</article>
<!-- Entry 3: Highlight Page 24 -->
<article class="pt-5 pb-5 border-b border-white/[0.07]" data-purpose="highlight-entry">
<div class="flex items-center justify-between text-[11px] font-semibold tracking-wider text-mutedText mb-2.5">
<span class="">HIGHLIGHT</span>
<span class="">PAGE 24</span>
</div>
<p class="text-white text-[15px] font-normal leading-relaxed">
          always be optimistic
        </p>
</article>
</main>
<!-- END: MainContentList -->
<!-- BEGIN: FloatingBottomNavigation -->
<!-- Frosted capsule segmented dock -->
<section class="absolute bottom-7 inset-x-0 flex justify-center pointer-events-none z-30" data-purpose="floating-dock-container">
<nav class="pointer-events-auto capsule-dock p-1 rounded-full flex items-center shadow-lg" data-purpose="segmented-control">
<!-- Library Tab (Inactive) -->
<button class="flex flex-col items-center justify-center w-[74px] h-[52px] rounded-full text-white/60 hover:text-white transition-all duration-200" type="button">
<!-- Book Icon -->
<span class="material-symbols-outlined text-[20px] mb-1 leading-none select-none">menu_book</span>
<span class="text-[10px] font-medium leading-tight">Library</span>
</button>
<!-- Notes Tab (Active Highlighted) -->
<button class="active-pill flex flex-col items-center justify-center w-[74px] h-[52px] rounded-full text-white transition-all duration-200" type="button">
<!-- Notepad / Pencil Icon -->
<svg class="w-5 h-5 stroke-current fill-none stroke-[1.8] mb-1" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<path d="M16 3l4 4L8 19H4v-4L16 3z"></path>
<path d="M3 6h2"></path>
<path d="M3 10h2"></path>
<path d="M3 14h2"></path>
<path d="M3 18h2"></path>
</svg>
<span class="text-[10px] font-medium leading-tight text-white">Notes</span>
</button>
</nav>
</section>
<!-- END: FloatingBottomNavigation -->
<!-- BEGIN: HomeIndicator -->
<!-- iOS Home Indicator bottom bar -->
<div class="w-full flex justify-center pb-2 pt-1 pointer-events-none z-40 bg-transparent" data-purpose="home-indicator">
<div class="w-32 h-1 bg-white/70 rounded-full"></div>
</div>
<!-- END: HomeIndicator -->
</div>
<!-- END: MobileContainer -->


</body></html>
